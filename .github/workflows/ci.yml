name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Store tests skip themselves without a database. The shared verification
    # target rejects that silent skip and CI supplies the database it requires.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yacht
          POSTGRES_PASSWORD: yacht
          POSTGRES_DB: yacht
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Manifest integration tests seed this registry themselves. Keeping it
      # local makes media-type and digest verification deterministic and avoids
      # teaching CI to depend on Docker Hub availability or rate limits.
      registry:
        image: registry:2
        ports: ["5000:5000"]

    env:
      YACHT_TEST_DATABASE_URL: postgres://yacht:yacht@localhost:5432/yacht?sslmode=disable
      YACHT_TEST_REGISTRY: localhost:5000
      YACHT_TEST_REGISTRY_INSECURE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # This is deliberately the same target a tag must pass. Keep generation,
      # shell, race, vet, boundary, gallery, and build gates in one maintained
      # definition rather than letting release verification drift from CI.
      - name: Verify
        run: make verify OUT="${RUNNER_TEMP}/yacht-gallery"

      - name: Preserve rendered gallery
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: yacht-gallery
          path: ${{ runner.temp }}/yacht-gallery
          # Preserve partial output after a render failure without replacing
          # the useful verification error when no page was written at all.
          if-no-files-found: ignore
          retention-days: 14
