<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yacht">
  <!--
    The mark is a hull and a sail reduced to two shapes, on the rounded square
    the sidebar already uses. It has to survive being drawn at 16px in a
    browser tab, which is what rules out anything with interior detail.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddcae"/>
      <stop offset="1" stop-color="#0e6f5a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- sail -->
  <path d="M33 13c8.4 5.6 12.6 12.4 12.6 20.4H33z" fill="#04231c" fill-opacity="0.92"/>
  <!-- hull -->
  <path d="M15 39h34c-2.2 7.4-8.6 12-17 12s-14.8-4.6-17-12z" fill="#04231c" fill-opacity="0.92"/>
</svg>
