<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img"
     aria-label="Yacht architecture: three seams between the engine and a wrapping application">
  <!--
    The README diagram. Its job is to make one idea obvious: there are exactly
    three places a wrapping application meets the engine, and each is an
    injected dependency rather than a fork.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8b8b99"/>
    </marker>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ddcae"/>
      <stop offset="1" stop-color="#0e6f5a"/>
    </linearGradient>
  </defs>

  <style>
    .t  { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .h  { font-size: 15px; font-weight: 650; fill: #e8e8ee; }
    .l  { font-size: 12.5px; fill: #8b8b99; }
    .k  { font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; fill: #5f5f6d; }
    .seam { font-size: 12px; font-weight: 650; fill: #2dd4a7; }
    .box  { fill: #16161d; stroke: #23232c; }
    .dash { fill: none; stroke: #8b8b99; stroke-width: 1.4; stroke-dasharray: 5 4; }
  </style>

  <rect width="1080" height="620" fill="#0b0b0f"/>

  <!-- wrapping application -->
  <rect x="40" y="36" width="1000" height="132" rx="12" fill="#121218" stroke="#2dd4a7" stroke-opacity="0.35" stroke-dasharray="6 5"/>
  <text class="t k" x="60" y="62">WRAPPING APPLICATION — CLOSED, OPTIONAL</text>
  <text class="t l" x="60" y="86">Multi-tenancy · metering · billing. Supplies three implementations; forks nothing.</text>
  <g>
    <rect class="box" x="60" y="102" width="300" height="46" rx="8"/>
    <text class="t l" x="76" y="131">Tenant-aware, multi-cluster orchestrator</text>
    <rect class="box" x="380" y="102" width="300" height="46" rx="8"/>
    <text class="t l" x="396" y="131">Identity resolved from a signed token</text>
    <rect class="box" x="700" y="102" width="320" height="46" rx="8"/>
    <text class="t l" x="716" y="131">Chrome: switcher, balance, usage</text>
  </g>

  <!-- seam arrows -->
  <g class="dash" marker-end="url(#arrow)">
    <path d="M210 152V214"/>
    <path d="M530 152V214"/>
    <path d="M860 152V214"/>
  </g>
  <g class="t seam" text-anchor="middle">
    <text x="210" y="183">SEAM 1</text>
    <text x="530" y="183">SEAM 2</text>
    <text x="860" y="183">SEAM 3</text>
  </g>

  <!-- engine -->
  <rect x="40" y="214" width="1000" height="208" rx="12" fill="#121218" stroke="#23232c"/>
  <g transform="translate(60 234)">
    <rect width="22" height="22" rx="6" fill="url(#mk)"/>
    <path d="M12.7 5c3.2 2.2 4.8 4.8 4.8 7.9h-4.8z" fill="#04231c" fill-opacity="0.92"/>
    <path d="M5.8 15.1h13c-.85 2.8-3.3 4.6-6.5 4.6s-5.65-1.8-6.5-4.6z" fill="#04231c" fill-opacity="0.92"/>
  </g>
  <text class="t h" x="92" y="251">yacht-engine</text>
  <text class="t l" x="92" y="271">MIT · single owner · runs standalone</text>

  <g>
    <rect class="box" x="60" y="292" width="300" height="52" rx="8"/>
    <text class="m" x="76" y="316" font-size="12.5" fill="#e8e8ee">Orchestrator</text>
    <text class="t l" x="76" y="334">one cluster, no k8s types leak out</text>

    <rect class="box" x="380" y="292" width="300" height="52" rx="8"/>
    <text class="m" x="396" y="316" font-size="12.5" fill="#e8e8ee">Identity</text>
    <text class="t l" x="396" y="334">answers: what is the owner_id?</text>

    <rect class="box" x="700" y="292" width="320" height="52" rx="8"/>
    <text class="m" x="716" y="316" font-size="12.5" fill="#e8e8ee">SlotProvider</text>
    <text class="t l" x="716" y="334">layout takes injectable slots</text>
  </g>

  <rect class="box" x="60" y="356" width="960" height="46" rx="8"/>
  <text class="t l" x="76" y="384">
    Postgres — owner_id on every table, unique constraints scoped by it
  </text>

  <!-- data plane -->
  <path class="dash" d="M540 422V478" marker-end="url(#arrow)"/>
  <text class="t l" x="556" y="456">sealed kubeconfig</text>

  <rect x="240" y="478" width="600" height="104" rx="12" fill="#121218" stroke="#23232c"/>
  <text class="t k" x="264" y="504">K3S CLUSTER</text>
  <text class="t l" x="264" y="528">Namespace per app · Pod Security Admission: restricted · LimitRange</text>
  <text class="t l" x="264" y="550">Traefik · cert-manager · BuildKit · authenticated registry</text>
  <text class="t l" x="264" y="572" fill="#5f5f6d">Every workload is an ordinary Deployment — kubectl still works.</text>
</svg>
